<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Joueurs — Valane Statistiques</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>Valane Statistiques</h1>
      <nav>
        <a href="/">Accueil</a>
        <a href="/about/">À propos</a>
        <a href="/stats/ah/">HDV (AH)</a>
        <a href="/stats/players/">Joueurs</a>
        <a href="/stats/playersShop/">Shops joueurs</a>
      </nav>
    </div>
  </header>
  <main class="container">
    <h1>Rechercher un joueur</h1>
    <form id="playerForm">
      <label>Nom du joueur: <input name="player" id="player" required></label>
      <button>Rechercher</button>
    </form>
    <div class="api-output" id="result"></div>
  </main>
  <script src="/static/app.js"></script>
  <script>
    document.getElementById('playerForm').addEventListener('submit', async e=>{
      e.preventDefault();
      const name = document.getElementById('player').value.trim();
      if(!name) return;
      const out = document.getElementById('result');
      out.innerHTML = '<div class="loader">Chargement…</div>';
      try{
        const fd = new FormData(); fd.append('player', name);
        const r = await fetch('/api/stats/players', {method:'POST', body:fd});
        const j = await r.json();
        renderJsonToBubbles(out, j);
      }catch(e){ out.innerHTML = '<div class="error">Erreur: '+e+'</div>' }
    });
  </script>
</body>
</html>
